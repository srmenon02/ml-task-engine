name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: ${{ secrets.DB_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      API_KEYS: ${{ secrets.API_KEYS }}
      RATE_LIMIT_ENABLED: ${{ secrets.RATE_LIMIT_ENABLED }}
      DEFAULT_USER_TIER: ${{ secrets.DEFAULT_USER_TIER }}
      MAX_PAGE_SIZE: ${{ secrets.MAX_PAGE_SIZE }}
      MAX_BULK_JOBS: ${{ secrets.MAX_BULK_JOBS }}
      CI: true

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov bandit safety

      - name: Run Unit Tests
        working-directory: backend
        run: pytest tests/unit -v --cov=backend --cov-report=xml

      - name: Run Integration Tests
        working-directory: backend
        run: pytest tests/integration -v --cov=backend --cov-append

      - name: Run Security Tests
        working-directory: backend
        run: pytest tests/security -v --cov=backend --cov-append

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml

services:
  - type: web
    name: ml-task-engine-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health 
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JSON_LOGS
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: MAX_PAGE_SIZE
        value: "100"
      - key: MAX_BULK_JOBS
        value: "100"
      - key: CORS_ORIGIN
        value: https://ml-task-engine-frontend.onrender.com
      - key: DB_URL
        fromDatabase:
          name: ml-task-engine-db 
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ml-task-engine-redis
          type: redis 
          property: connectionString 
      - key: CELERY_BROKER_URL
        fromService:
          name: ml-task-engine-redis 
          type: redis 
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ml-task-engine-redis 
          type: redis 
          property: connectionString 
      - key: API_KEYS
        sync: false 
      - key: SECRET_KEY
        generateValue: true 
    
  - type: worker
    name: ml-task-engine-worker
    runtime: docker 
    dockerfilePath: ./backend/Dockerfile.worker 
    dockerContext: ./backend 
    plan: free 
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JSON_LOGS
        value: "true"
      - key: DB_URL
        fromDatabase:
          name: ml-task-engine-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ml-task-engine-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ml-task-engine-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ml-task-engine-redis
          type: redis
          property: connectionString
      - key: API_KEYS
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: redis
    name: ml-task-engine-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: ml-task-engine-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ml-task-engine-api.onrender.com
      - key: VITE_API_KEY
        sync: false
        
databases:
  - name: ml-task-engine-db
    plan: free
    databaseName: taskengine
    user: taskengine


  
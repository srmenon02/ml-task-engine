[pytest]
testpaths = testpaths
python_files = test_*.pytest
python_classes = Test*
python_functions = test_*
adopts =
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=html
    --cov-report=term-missing
    -cov-fail-under=80
markers = 
    unit: Unit tests
    integration: Integration tests (DB, API, workers)
    security: Security tests (OWASP)
    load: Load and performance tests
    slow: Tests that take more than 5 seconds
asyncio_mode = auto